<input type="file" id="fileInput" accept=".html,.htm,.txt" style="display: none;" aria-label="选择本地 HTML 文件">
<input type="file" id="imageInput" accept="image/*" style="display: none;" aria-label="选择要插入的图片">

<script>
(function() {
    'use strict';

    var STORAGE_KEY = 'nor_tools_html_content';
    var STORAGE_NAME = 'nor_tools_html_filename';
    var STORAGE_MODE = 'nor_tools_html_mode';

    var codeEditor = document.getElementById('codeEditor');
    var visualEditor = document.getElementById('visualEditor');
    var previewFrame = document.getElementById('previewFrame');
    var statusText = document.getElementById('statusText');
    var statusDot = document.getElementById('statusDot');
    var codeMeta = document.getElementById('codeMeta');
    var lineInfo = document.getElementById('lineInfo');
    var fileInfo = document.getElementById('fileInfo');
    var modeInfo = document.getElementById('modeInfo');
    var paneTitle = document.getElementById('paneTitle');
    var fileInput = document.getElementById('fileInput');
    var imageInput = document.getElementById('imageInput');
    var resizer = document.getElementById('resizer');
    var main = document.getElementById('main');
    var editorPane = document.getElementById('editorPane');
    var previewPane = document.getElementById('previewPane');
    var modeBtns = document.querySelectorAll('.mode-btn');
    var visualToolbar = document.getElementById('visualToolbar');

    var currentFileName = 'untitled.html';
    var currentMode = 'code';
    var saveTimer = null;
    var renderTimer = null;
    var savedVisualRange = null;
    var textboxCounter = 0;

    var DEFAULT_HTML = [
        '<!DOCTYPE html>',
        '<html lang="zh-CN">',
        '<head>',
        '<meta charset="UTF-8">',
        '<meta name="viewport" content="width=device-width, initial-scale=1.0">',
        '<title>我的页面</title>',
        '<style>',
        '  body {',
        '    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;',
        '    max-width: 800px;',
        '    margin: 60px auto;',
        '    padding: 0 24px;',
        '    line-height: 1.8;',
        '    color: #1a202c;',
        '  }',
        '  h1 {',
        '    color: #3b4cca;',
        '    font-size: 32px;',
        '    margin-bottom: 16px;',
        '  }',
        '</style>',
        '</head>',
        '<body>',
        '<h1>Hello, World!</h1>',
        '<p>这是一段示例内容，直接在左侧编辑，右侧会实时显示效果。</p>',
        '<p>支持完整的 HTML / CSS / JavaScript，例如：</p>',
        '<button onclick="alert(\'你好！\')">点我试试</button>',
        '</body>',
        '</html>'
    ].join('\n');

    function extractBodyContent(html) {
        if (!html) return '';
        var bodyMatch = html.match(/<body[^>]*>([\s\S]*)<\/body>/i);
        if (bodyMatch) return bodyMatch[1];
        return html;
    }

    function extractStyleContent(html) {
        var styles = [];
        var re = /<style[^>]*>([\s\S]*?)<\/style>/gi;
        var match;
        while ((match = re.exec(html)) !== null) {
            styles.push(match[1]);
        }
        return styles.join('\n');
    }

    function replaceBodyContent(fullHtml, newBody) {
        if (/<body[^>]*>[\s\S]*<\/body>/i.test(fullHtml)) {
            return fullHtml.replace(/(<body[^>]*>)[\s\S]*(<\/body>)/i, '$1' + newBody + '$2');
        }
        var headMatch = fullHtml.match(/<head[^>]*>[\s\S]*?<\/head>/i);
        var headPart = headMatch ? headMatch[0] : '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n</head>';
        return headPart + '\n<body>\n' + newBody + '\n</body>\n</html>';
    }

    function switchMode(mode) {
        if (mode === currentMode) return;

        if (mode === 'visual') {
            var bodyContent = extractBodyContent(codeEditor.value);
            visualEditor.innerHTML = bodyContent;
            applyStylesToVisual();
            codeEditor.classList.add('hidden');
            codeEditor.classList.remove('active');
            visualEditor.classList.add('active');
            visualToolbar.classList.add('active');
            bindAllTextBoxes();
        } else {
            var newBody = visualEditor.innerHTML;
            cleanVisualState();
            codeEditor.value = replaceBodyContent(codeEditor.value, newBody);
            visualEditor.classList.remove('active');
            visualToolbar.classList.remove('active');
            codeEditor.classList.remove('hidden');
        }

        currentMode = mode;

        modeBtns.forEach(function(btn) {
            var isActive = btn.getAttribute('data-mode') === mode;
            btn.classList.toggle('active', isActive);
            btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
        });

        paneTitle.textContent = mode === 'code' ? 'HTML 源码' : '可视化编辑';
        modeInfo.textContent = mode === 'code' ? '源码模式' : '可视化模式';

        updateMeta();
        renderPreview();
        try { localStorage.setItem(STORAGE_MODE, mode); } catch (e) {}

        if (mode === 'code') {
            codeEditor.focus();
        } else {
            visualEditor.focus();
        }
    }

    function cleanVisualState() {
        visualEditor.querySelectorAll('.tb-wrap.selected').forEach(function(w) {
            w.classList.remove('selected');
        });
        visualEditor.querySelectorAll('.tb-resizer').forEach(function(r) {
            r.remove();
        });
    }

    function applyStylesToVisual() {
        var oldStyle = document.getElementById('visual-inline-style');
        if (oldStyle) oldStyle.remove();

        var styleContent = extractStyleContent(codeEditor.value);
        if (styleContent) {
            var styleEl = document.createElement('style');
            styleEl.id = 'visual-inline-style';
            styleEl.textContent = styleContent;
            document.head.appendChild(styleEl);
        }
    }

    function init() {
        var saved = null;
        var savedName = null;
        var savedMode = null;
        try {
            saved = localStorage.getItem(STORAGE_KEY);
            savedName = localStorage.getItem(STORAGE_NAME);
            savedMode = localStorage.getItem(STORAGE_MODE);
        } catch (e) {}

        if (saved) {
            codeEditor.value = saved;
        } else {
            codeEditor.value = DEFAULT_HTML;
        }
        if (savedName) {
            currentFileName = savedName;
            fileInfo.textContent = savedName;
        }

        updateMeta();
        renderPreview();

        if (savedMode === 'visual') {
            switchMode('visual');
        }
    }

    function updateMeta() {
        if (currentMode === 'code') {
            var value = codeEditor.value;
            var chars = value.length;
            var lines = value.split('\n').length;
            codeMeta.textContent = lines + ' 行 · ' + chars + ' 字符';
        } else {
            var text = visualEditor.innerText || '';
            var chars2 = text.replace(/\s/g, '').length;
            codeMeta.textContent = chars2 + ' 字';
        }
    }

    function updateCursorInfo() {
        if (currentMode !== 'code') return;
        var pos = codeEditor.selectionStart;
        var before = codeEditor.value.slice(0, pos);
        var lines = before.split('\n');
        var line = lines.length;
        var col = lines[lines.length - 1].length + 1;
        lineInfo.textContent = 'Ln ' + line + ', Col ' + col;
    }

    function renderPreview() {
        var html;
        if (currentMode === 'code') {
            html = codeEditor.value;
        } else {
            var clone = visualEditor.cloneNode(true);
            clone.querySelectorAll('.tb-wrap.selected').forEach(function(w) {
                w.classList.remove('selected');
            });
            clone.querySelectorAll('.tb-resizer').forEach(function(r) {
                r.remove();
            });
            clone.querySelectorAll('.tb-wrap').forEach(function(w) {
                w.style.border = 'none';
                w.style.padding = '10px 14px';
            });
            var newBody = clone.innerHTML;
            html = replaceBodyContent(codeEditor.value, newBody);
        }
        previewFrame.srcdoc = html;
    }

    function autoSave() {
        clearTimeout(saveTimer);
        statusText.textContent = '编辑中…';
        statusDot.classList.add('saving');

        saveTimer = setTimeout(function() {
            try {
                if (currentMode === 'visual') {
                    var clone = visualEditor.cloneNode(true);
                    clone.querySelectorAll('.tb-wrap.selected').forEach(function(w) {
                        w.classList.remove('selected');
                    });
                    clone.querySelectorAll('.tb-resizer').forEach(function(r) {
                        r.remove();
                    });
                    clone.querySelectorAll('.tb-wrap').forEach(function(w) {
                        w.style.border = 'none';
                        w.style.padding = '10px 14px';
                    });
                    codeEditor.value = replaceBodyContent(codeEditor.value, clone.innerHTML);
                }
                localStorage.setItem(STORAGE_KEY, codeEditor.value);
                statusText.textContent = '已保存 ' + new Date().toTimeString().slice(0, 5);
                statusDot.classList.remove('saving');
            } catch (e) {
                statusText.textContent = '保存失败';
            }
        }, 500);
    }

    function scheduleRender() {
        clearTimeout(renderTimer);
        renderTimer = setTimeout(function() {
            renderPreview();
        }, 300);
    }

    codeEditor.addEventListener('input', function() {
        updateMeta();
        autoSave();
        scheduleRender();
        if (currentMode === 'visual') {
            applyStylesToVisual();
        }
    });

    codeEditor.addEventListener('click', updateCursorInfo);
    codeEditor.addEventListener('keyup', updateCursorInfo);
    codeEditor.addEventListener('select', updateCursorInfo);

    codeEditor.addEventListener('keydown', function(e) {
        if (e.key === 'Tab') {
            e.preventDefault();
            var start = this.selectionStart;
            var end = this.selectionEnd;
            if (start === end) {
                this.value = this.value.slice(0, start) + '  ' + this.value.slice(end);
                this.selectionStart = this.selectionEnd = start + 2;
            } else {
                var selected = this.value.slice(start, end);
                var indented = selected.split('\n').map(function(line) {
                    return '  ' + line;
                }).join('\n');
                this.value = this.value.slice(0, start) + indented + this.value.slice(end);
                this.selectionStart = start;
                this.selectionEnd = start + indented.length;
            }
            updateMeta();
            autoSave();
            scheduleRender();
        }

        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            renderPreview();
            statusText.textContent = '已刷新预览';
            statusDot.classList.remove('saving');
        }

        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
            e.preventDefault();
            doSave();
        }

        if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
            e.preventDefault();
            doNew();
        }

        if ((e.ctrlKey || e.metaKey) && e.key === ']') {
            e.preventDefault();
            var pos = this.selectionStart;
            this.value = this.value.slice(0, pos) + '  ' + this.value.slice(pos);
            this.selectionStart = this.selectionEnd = pos + 2;
            autoSave();
            scheduleRender();
        }
        if ((e.ctrlKey || e.metaKey) && e.key === '[') {
            e.preventDefault();
            var pos2 = this.selectionStart;
            if (this.value.slice(pos2 - 2, pos2) === '  ') {
                this.value = this.value.slice(0, pos2 - 2) + this.value.slice(pos2);
                this.selectionStart = this.selectionEnd = pos2 - 2;
                autoSave();
                scheduleRender();
            }
        }
    });

    visualEditor.addEventListener('input', function() {
        updateMeta();
        autoSave();
        scheduleRender();
    });

    visualEditor.addEventListener('paste', function(e) {
        e.preventDefault();
        var text = (e.clipboardData || window.clipboardData).getData('text/plain');
        document.execCommand('insertText', false, text);
    });

    function saveVisualSelection() {
        var sel = window.getSelection();
        if (sel.rangeCount > 0) {
            try { savedVisualRange = sel.getRangeAt(0).cloneRange(); } catch (e) {}
        }
    }

    function restoreVisualSelection() {
        if (!savedVisualRange) return false;
        try {
            var sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(savedVisualRange);
            return true;
        } catch (e) { return false; }
    }

    visualToolbar.querySelectorAll('button, select, input').forEach(function(el) {
        el.addEventListener('mousedown', saveVisualSelection);
        el.addEventListener('touchstart', saveVisualSelection, { passive: true });
    });

    function vExec(cmd, value) {
        restoreVisualSelection();
        visualEditor.focus();
        document.execCommand(cmd, false, value || null);
        autoSave();
        scheduleRender();
    }

    visualToolbar.querySelectorAll('button[data-cmd]').forEach(function(btn) {
        btn.addEventListener('click', function() {
            vExec(this.getAttribute('data-cmd'));
        });
    });

    document.getElementById('formatBlock').addEventListener('change', function() {
        vExec('formatBlock', this.value);
    });

    document.getElementById('fontSize').addEventListener('change', function() {
        vExec('fontSize', this.value);
    });

    document.getElementById('vTextColor').addEventListener('input', function() {
        vExec('foreColor', this.value);
    });

    document.getElementById('vBgColor').addEventListener('input', function() {
        vExec('hiliteColor', this.value);
    });

    visualToolbar.querySelectorAll('button[data-act]').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var act = this.getAttribute('data-act');
            if (act === 'link') {
                restoreVisualSelection();
                var url = prompt('请输入链接地址：', 'https://');
                if (url) vExec('createLink', url);
            } else if (act === 'image') {
                imageInput.click();
            } else if (act === 'textbox') {
                insertTextBox();
            } else if (act === 'table') {
                insertTable();
            } else if (act === 'hr') {
                vExec('insertHTML', '<hr><p><br></p>');
            }
        });
    });

    imageInput.addEventListener('change', function(e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(ev) {
            restoreVisualSelection();
            visualEditor.focus();
            document.execCommand('insertHTML', false, '<img src="' + ev.target.result + '" alt="图片">');
            autoSave();
            scheduleRender();
        };
        reader.readAsDataURL(file);
        imageInput.value = '';
    });

    function insertTextBox() {
        textboxCounter++;
        var offset = (textboxCounter % 5) * 10;

        var wrap = document.createElement('div');
        wrap.className = 'tb-wrap';
        wrap.setAttribute('contenteditable', 'false');
        wrap.style.marginLeft = offset + 'px';
        wrap.style.width = '320px';

        var inner = document.createElement('div');
        inner.className = 'tb-inner';
        inner.setAttribute('contenteditable', 'true');
        inner.textContent = '双击编辑文本框…';

        var resizerEl = document.createElement('div');
        resizerEl.className = 'tb-resizer';

        wrap.appendChild(inner);
        wrap.appendChild(resizerEl);

        restoreVisualSelection();
        var sel = window.getSelection();
        if (sel.rangeCount) {
            var range = sel.getRangeAt(0);
            range.collapse(false);
            range.insertNode(wrap);
            var p = document.createElement('p');
            p.innerHTML = '<br>';
            wrap.parentNode.insertBefore(p, wrap.nextSibling);
            var nr = document.createRange();
            nr.setStart(p, 0);
            nr.collapse(true);
            sel.removeAllRanges();
            sel.addRange(nr);
        } else {
            visualEditor.appendChild(wrap);
        }

        bindTextBoxEvents(wrap);
        selectTextBox(wrap);

        autoSave();
        scheduleRender();
        statusText.textContent = '已插入文本框';
        statusDot.classList.remove('saving');
    }

    function bindAllTextBoxes() {
        visualEditor.querySelectorAll('.tb-wrap').forEach(function(wrap) {
            if (wrap._bound) return;
            if (!wrap.querySelector('.tb-resizer')) {
                var r = document.createElement('div');
                r.className = 'tb-resizer';
                wrap.appendChild(r);
            }
            bindTextBoxEvents(wrap);
        });
    }

    function bindTextBoxEvents(wrap) {
        if (wrap._bound) return;
        wrap._bound = true;

        var inner = wrap.querySelector('.tb-inner');
        var resizerEl = wrap.querySelector('.tb-resizer');
        if (!inner || !resizerEl) return;

        wrap.addEventListener('mousedown', function(e) {
            if (e.target === resizerEl) return;
            if (wrap.classList.contains('selected') && document.activeElement === inner) return;
            e.preventDefault();
            e.stopPropagation();
            selectTextBox(wrap);
            startTextBoxDrag(e, wrap);
        });

        function startResize(e) {
            if (e.target !== resizerEl) return;
            e.preventDefault();
            e.stopPropagation();
            startTextBoxResize(e, wrap);
        }

        resizerEl.addEventListener('mousedown', startResize);
        resizerEl.addEventListener('touchstart', startResize, { passive: false });

        wrap.addEventListener('dblclick', function(e) {
            if (e.target === resizerEl) return;
            e.preventDefault();
            e.stopPropagation();
            selectTextBox(wrap);
            inner.focus();
            var range = document.createRange();
            range.selectNodeContents(inner);
            var sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
        });

        inner.addEventListener('input', function() {
            autoSave();
            scheduleRender();
            updateMeta();
        });
    }

    function selectTextBox(wrap) {
        visualEditor.querySelectorAll('.tb-wrap.selected').forEach(function(w) {
            w.classList.remove('selected');
        });
        wrap.classList.add('selected');
    }

    function startTextBoxDrag(e, wrap) {
        var point = e.touches ? e.touches[0] : e;
        var startX = point.clientX;
        var startML = parseInt(wrap.style.marginLeft) || 0;
        var moved = false;

        function onMove(ev) {
            var p = ev.touches ? ev.touches[0] : ev;
            var dx = p.clientX - startX;
            if (Math.abs(dx) > 2) moved = true;
            wrap.style.marginLeft = Math.max(0, startML + dx) + 'px';
        }

        function onUp() {
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
            document.removeEventListener('touchmove', onMove);
            document.removeEventListener('touchend', onUp);
            if (moved) {
                autoSave();
                scheduleRender();
            }
        }

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend', onUp);
    }

    function startTextBoxResize(e, wrap) {
        var point = e.touches ? e.touches[0] : e;
        var startX = point.clientX;
        var startW = wrap.offsetWidth;

        function onMove(ev) {
            var p = ev.touches ? ev.touches[0] : ev;
            var dx = p.clientX - startX;
            var newW = Math.max(120, startW + dx);
            wrap.style.width = newW + 'px';
        }

        function onUp() {
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
            document.removeEventListener('touchmove', onMove);
            document.removeEventListener('touchend', onUp);
            autoSave();
            scheduleRender();
        }

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend', onUp);
    }

    function insertTable() {
        var rows = parseInt(prompt('表格行数：', '3'), 10);
        var cols = parseInt(prompt('表格列数：', '3'), 10);
        if (!rows || !cols || rows < 1 || cols < 1) return;

        var html = '<table>';
        for (var i = 0; i < rows; i++) {
            html += '<tr>';
            for (var j = 0; j < cols; j++) {
                html += '<td><br></td>';
            }
            html += '</tr>';
        }
        html += '</table><p><br></p>';

        vExec('insertHTML', html);
    }

    visualEditor.addEventListener('click', function(e) {
        var wrap = e.target.closest ? e.target.closest('.tb-wrap') : null;
        if (!wrap) {
            visualEditor.querySelectorAll('.tb-wrap.selected').forEach(function(w) {
                w.classList.remove('selected');
            });
        } else {
            selectTextBox(wrap);
        }
    });

    function doNew() {
        if (currentMode === 'visual') {
            var bodyContent = extractBodyContent(codeEditor.value);
            if (bodyContent.trim() && bodyContent !== extractBodyContent(DEFAULT_HTML)) {
                if (!confirm('当前内容未保存为文件，确定要新建吗？')) return;
            }
        } else {
            if (codeEditor.value.trim() && codeEditor.value !== DEFAULT_HTML) {
                if (!confirm('当前内容未保存为文件，确定要新建吗？')) return;
            }
        }

        codeEditor.value = DEFAULT_HTML;
        currentFileName = 'untitled.html';
        fileInfo.textContent = currentFileName;

        if (currentMode === 'visual') {
            visualEditor.innerHTML = extractBodyContent(DEFAULT_HTML);
            applyStylesToVisual();
            bindAllTextBoxes();
        }

        updateMeta();
        autoSave();
        renderPreview();
        statusText.textContent = '已新建';
        statusDot.classList.remove('saving');
    }

    function doOpen() {
        fileInput.click();
    }

    fileInput.addEventListener('change', function(e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(ev) {
            codeEditor.value = ev.target.result;
            currentFileName = file.name;
            fileInfo.textContent = file.name;

            if (currentMode === 'visual') {
                visualEditor.innerHTML = extractBodyContent(codeEditor.value);
                applyStylesToVisual();
                bindAllTextBoxes();
            }

            updateMeta();
            autoSave();
            renderPreview();
            statusText.textContent = '已打开 ' + file.name;
            statusDot.classList.remove('saving');
        };
        reader.readAsText(file, 'utf-8');
        fileInput.value = '';
    });

    function doSave() {
        if (currentMode === 'visual') {
            cleanVisualState();
            var clone = visualEditor.cloneNode(true);
            clone.querySelectorAll('.tb-resizer').forEach(function(r) { r.remove(); });
            clone.querySelectorAll('.tb-wrap').forEach(function(w) {
                w.style.border = 'none';
                w.style.padding = '10px 14px';
            });
            codeEditor.value = replaceBodyContent(codeEditor.value, clone.innerHTML);
        }

        var html = codeEditor.value;
        var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = currentFileName || 'untitled.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        try {
            localStorage.setItem(STORAGE_KEY, html);
            localStorage.setItem(STORAGE_NAME, currentFileName);
        } catch (e) {}

        statusText.textContent = '✓ 已保存';
        statusDot.classList.remove('saving');
    }

    function doFormat() {
        var html = codeEditor.value;
        var tokens = html.replace(/>\s*</g, '>\n<').split('\n');
        var indent = 0;
        var result = [];
        var inlineTags = ['a','b','i','u','s','em','strong','span','code','small','big','sub','sup','font'];

        tokens.forEach(function(token) {
            var t = token.trim();
            if (!t) return;

            var isClosing = /^<\//.test(t);
            var isSelfClosing = /\/>$/.test(t) || /^<(br|hr|img|input|meta|link)[\s>]/i.test(t);
            var tagMatch = t.match(/^<\/?([a-zA-Z][a-zA-Z0-9]*)/);
            var tagName = tagMatch ? tagMatch[1].toLowerCase() : '';
            var isInline = inlineTags.indexOf(tagName) !== -1;

            if (isClosing && !isInline) {
                indent = Math.max(0, indent - 1);
            }

            result.push('  '.repeat(indent) + t);

            if (!isClosing && !isSelfClosing && !isInline && tagMatch) {
                indent++;
            }
        });

        codeEditor.value = result.join('\n');
        updateMeta();
        autoSave();
        renderPreview();
        statusText.textContent = '✓ 已格式化';
        statusDot.classList.remove('saving');
    }

    function doMinify() {
        var html = codeEditor.value;
        var minified = html
            .replace(/>\s+</g, '><')
            .replace(/\n\s*/g, '')
            .replace(/\s{2,}/g, ' ')
            .trim();
        codeEditor.value = minified;
        updateMeta();
        autoSave();
        renderPreview();
        statusText.textContent = '✓ 已压缩';
        statusDot.classList.remove('saving');
    }

    function doTemplate() {
        var choice = prompt(
            '选择要插入的模板（输入编号）：\n\n' +
            '1 = 空白 HTML 结构\n' +
            '2 = 居中卡片\n' +
            '3 = 响应式导航栏\n' +
            '4 = 简单按钮动画',
            '1'
        );
        if (!choice) return;
        var tpl = '';
        if (choice === '1') {
            tpl = '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n<title>页面</title>\n</head>\n<body>\n\n</body>\n</html>';
        } else if (choice === '2') {
            tpl = '<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n<style>\n  body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f2f5; font-family: sans-serif; }\n  .card { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); max-width: 400px; }\n  h1 { margin: 0 0 12px; color: #3b4cca; }\n</style>\n</head>\n<body>\n<div class="card">\n  <h1>卡片标题</h1>\n  <p>卡片内容</p>\n</div>\n</body>\n</html>';
        } else if (choice === '3') {
            tpl = '<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n<style>\n  body { margin: 0; font-family: sans-serif; }\n  nav { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; background: #3b4cca; color: #fff; }\n  nav .logo { font-weight: 700; font-size: 18px; }\n  nav ul { display: flex; gap: 20px; list-style: none; margin: 0; padding: 0; }\n  nav a { color: #fff; text-decoration: none; }\n</style>\n</head>\n<body>\n<nav>\n  <div class="logo">Logo</div>\n  <ul>\n    <li><a href="#">首页</a></li>\n    <li><a href="#">关于</a></li>\n    <li><a href="#">联系</a></li>\n  </ul>\n</nav>\n</body>\n</html>';
        } else if (choice === '4') {
            tpl = '<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n<style>\n  body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #1a202c; }\n  button { padding: 16px 32px; border: none; border-radius: 8px; background: #3b4cca; color: #fff; font-size: 16px; cursor: pointer; transition: all 0.3s; }\n  button:hover { background: #2a38a8; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(59,76,202,0.4); }\n</style>\n</head>\n<body>\n<button>点我</button>\n</body>\n</html>';
        }
        if (tpl) {
            codeEditor.value = tpl;
            if (currentMode === 'visual') {
                visualEditor.innerHTML = extractBodyContent(tpl);
                applyStylesToVisual();
                bindAllTextBoxes();
            }
            updateMeta();
            autoSave();
            renderPreview();
            statusText.textContent = '已应用模板';
            statusDot.classList.remove('saving');
        }
    }

    modeBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
            switchMode(this.getAttribute('data-mode'));
        });
    });

    document.querySelectorAll('.tool-link').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var act = this.getAttribute('data-act');
            switch (act) {
                case 'new': doNew(); break;
                case 'open': doOpen(); break;
                case 'save': doSave(); break;
                case 'format': doFormat(); break;
                case 'minify': doMinify(); break;
                case 'template': doTemplate(); break;
                case 'run': renderPreview(); statusText.textContent = '已刷新'; break;
            }
        });
    });

    var isDragging = false;

    resizer.addEventListener('mousedown', function(e) {
        isDragging = true;
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        e.preventDefault();
    });

    document.addEventListener('mousemove', function(e) {
        if (!isDragging) return;
        var rect = main.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var totalW = rect.width;
        var minW = 200;
        var maxW = totalW - 200;
        x = Math.max(minW, Math.min(maxW, x));
        var percent = (x / totalW) * 100;
        editorPane.style.flex = '0 0 ' + percent + '%';
        previewPane.style.flex = '0 0 ' + (100 - percent - (8 / totalW * 100)) + '%';
    });

    document.addEventListener('mouseup', function() {
        if (isDragging) {
            isDragging = false;
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
        }
    });

    resizer.addEventListener('touchstart', function(e) {
        isDragging = true;
        e.preventDefault();
    }, { passive: false });

    document.addEventListener('touchmove', function(e) {
        if (!isDragging) return;
        var touch = e.touches[0];
        var rect = main.getBoundingClientRect();
        var x = touch.clientX - rect.left;
        var totalW = rect.width;
        var minW = 150;
        var maxW = totalW - 150;
        x = Math.max(minW, Math.min(maxW, x));
        var percent = (x / totalW) * 100;
        editorPane.style.flex = '0 0 ' + percent + '%';
        previewPane.style.flex = '0 0 ' + (100 - percent - (8 / totalW * 100)) + '%';
    }, { passive: false });

    document.addEventListener('touchend', function() {
        isDragging = false;
    });

    window.addEventListener('beforeunload', function() {
        try {
            if (currentMode === 'visual') {
                var clone = visualEditor.cloneNode(true);
                clone.querySelectorAll('.tb-wrap.selected').forEach(function(w) {
                    w.classList.remove('selected');
                });
                clone.querySelectorAll('.tb-resizer').forEach(function(r) { r.remove(); });
                clone.querySelectorAll('.tb-wrap').forEach(function(w) {
                    w.style.border = 'none';
                    w.style.padding = '10px 14px';
                });
                codeEditor.value = replaceBodyContent(codeEditor.value, clone.innerHTML);
            }
            if (codeEditor.value) {
                localStorage.setItem(STORAGE_KEY, codeEditor.value);
                localStorage.setItem(STORAGE_NAME, currentFileName);
                localStorage.setItem(STORAGE_MODE, currentMode);
            }
        } catch (e) {}
    });

    init();
    if (currentMode === 'code') {
        codeEditor.focus();
    }

})();
</script>
</body>
</html>
