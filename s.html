.search-input {

<script>
(function() {
    'use strict';

    var $ = function(id) { return document.getElementById(id); };

    var searchInput = $('searchInput');
    var searchBtn = $('searchBtn');
    var engineBar = $('engineBar');
    var resultsList = $('resultsList');
    var resultsMeta = $('resultsMeta');
    var previewContent = $('previewContent');
    var previewMeta = $('previewMeta');
    var footerInfo = $('footerInfo');

    var currentEngine = 'duckduckgo';
    var currentResults = [];
    var currentSelectedIndex = -1;
    var isSearching = false;

    // ==================== 引擎配置 ====================
    var ENGINE_NAMES = {
        duckduckgo: 'DuckDuckGo',
        wikipedia: 'Wikipedia',
        stackoverflow: 'Stack Overflow',
        github: 'GitHub',
        news: 'Hacker News'
    };

    // ==================== 工具函数 ====================
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, function(c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    function setStatus(text) {
        footerInfo.textContent = text;
    }

    function getHostname(url) {
        try {
            return new URL(url).hostname.replace('www.', '');
        } catch (e) {
            return '';
        }
    }

    function truncate(str, len) {
        if (!str) return '';
        var s = String(str).replace(/\s+/g, ' ').trim();
        return s.length > len ? s.slice(0, len) + '…' : s;
    }

    // ==================== 搜索引擎 API ====================

    // 1. DuckDuckGo
    async function searchDuckDuckGo(query) {
        var url = 'https://api.duckduckgo.com/?q=' + encodeURIComponent(query) +
                  '&format=json&no_html=1&skip_disambig=1&t=nortools';

        var res = await fetch(url);
        if (!res.ok) throw new Error('DuckDuckGo 请求失败');
        var data = await res.json();

        var results = [];

        // 摘要结果
        if (data.AbstractText) {
            results.push({
                title: data.Heading || query,
                url: data.AbstractURL || 'https://duckduckgo.com/?q=' + encodeURIComponent(query),
                snippet: data.AbstractText,
                source: 'DuckDuckGo 摘要',
                type: 'summary'
            });
        }

        // 相关主题
        if (Array.isArray(data.RelatedTopics)) {
            data.RelatedTopics.forEach(function(topic) {
                if (topic.Topics) {
                    topic.Topics.forEach(function(sub) {
                        if (sub.Text && sub.FirstURL) {
                            results.push({
                                title: sub.Text.split(' - ')[0] || sub.Text,
                                url: sub.FirstURL,
                                snippet: sub.Text,
                                source: 'DuckDuckGo 相关',
                                type: 'related'
                            });
                        }
                    });
                } else if (topic.Text && topic.FirstURL) {
                    results.push({
                        title: topic.Text.split(' - ')[0] || topic.Text,
                        url: topic.FirstURL,
                        snippet: topic.Text,
                        source: 'DuckDuckGo 相关',
                        type: 'related'
                    });
                }
            });
        }

        // 结果链接
        if (Array.isArray(data.Results)) {
            data.Results.forEach(function(item) {
                if (item.Text && item.FirstURL) {
                    results.push({
                        title: item.Text.split(' - ')[0] || item.Text,
                        url: item.FirstURL,
                        snippet: item.Text,
                        source: 'DuckDuckGo 结果',
                        type: 'result'
                    });
                }
            });
        }

        if (results.length === 0) {
            throw new Error('DuckDuckGo 未找到相关结果');
        }

        return results;
    }

    // 2. Wikipedia
    async function searchWikipedia(query) {
        var lang = /[\u4e00-\u9fa5]/.test(query) ? 'zh' : 'en';
        var url = 'https://' + lang + '.wikipedia.org/w/api.php' +
                  '?action=query&format=json&origin=*' +
                  '&list=search&srsearch=' + encodeURIComponent(query) +
                  '&srlimit=15&utf8=1';

        var res = await fetch(url);
        if (!res.ok) throw new Error('Wikipedia 请求失败');
        var data = await res.json();

        if (!data.query || !Array.isArray(data.query.search)) {
            throw new Error('Wikipedia 返回格式异常');
        }

        var results = data.query.search.map(function(item) {
            var snippet = item.snippet
                .replace(/<[^>]+>/g, '')
                .replace(/&[a-z]+;/gi, ' ')
                .trim();
            return {
                title: item.title,
                url: 'https://' + lang + '.wikipedia.org/wiki/' + encodeURIComponent(item.title),
                snippet: snippet,
                source: 'Wikipedia',
                type: 'wiki',
                extra: { wordcount: item.wordcount, timestamp: item.timestamp }
            };
        });

        if (results.length === 0) {
            throw new Error('Wikipedia 未找到相关结果');
        }

        return results;
    }

    // 3. Stack Overflow
    async function searchStackOverflow(query) {
        var url = 'https://api.stackexchange.com/2.3/search/advanced' +
                  '?order=desc&sort=relevance&q=' + encodeURIComponent(query) +
                  '&site=stackoverflow&pagesize=15&filter=default';

        var res = await fetch(url);
        if (!res.ok) throw new Error('Stack Overflow 请求失败');
        var data = await res.json();

        if (!Array.isArray(data.items)) {
            throw new Error('Stack Overflow 返回格式异常');
        }

        var results = data.items.map(function(item) {
            return {
                title: item.title,
                url: item.link,
                snippet: '得分：' + item.score + ' · 回答：' + item.answer_count +
                         (item.is_answered ? ' · ✓ 已解决' : '') +
                         (item.tags ? ' · 标签：' + item.tags.slice(0, 3).join(', ') : ''),
                source: 'Stack Overflow',
                type: 'so',
                extra: {
                    score: item.score,
                    answers: item.answer_count,
                    answered: item.is_answered
                }
            };
        });

        if (results.length === 0) {
            throw new Error('Stack Overflow 未找到相关结果');
        }

        return results;
    }

    // 4. GitHub
    async function searchGitHub(query) {
        var url = 'https://api.github.com/search/repositories?q=' +
                  encodeURIComponent(query) + '&sort=stars&order=desc&per_page=15';

        var res = await fetch(url, {
            headers: { 'Accept': 'application/vnd.github.v3+json' }
        });
        if (!res.ok) throw new Error('GitHub 请求失败');
        var data = await res.json();

        if (!Array.isArray(data.items)) {
            throw new Error('GitHub 返回格式异常');
        }

        var results = data.items.map(function(item) {
            return {
                title: item.full_name,
                url: item.html_url,
                snippet: item.description || '（暂无描述）',
                source: 'GitHub',
                type: 'github',
                extra: {
                    stars: item.stargazers_count,
                    language: item.language,
                    forks: item.forks_count
                }
            };
        });

        if (results.length === 0) {
            throw new Error('GitHub 未找到相关结果');
        }

        return results;
    }

    // 5. Hacker News
    async function searchHackerNews(query) {
        var url = 'https://hn.algolia.com/api/v1/search?query=' +
                  encodeURIComponent(query) + '&tags=story&hitsPerPage=15';

        var res = await fetch(url);
        if (!res.ok) throw new Error('Hacker News 请求失败');
        var data = await res.json();

        if (!Array.isArray(data.hits)) {
            throw new Error('Hacker News 返回格式异常');
        }

        var results = data.hits.map(function(item) {
            return {
                title: item.title || item.story_title || '（无标题）',
                url: item.url || 'https://news.ycombinator.com/item?id=' + item.objectID,
                snippet: truncate(item.story_text || item.comment_text || item.title || '', 150),
                source: 'Hacker News',
                type: 'hn',
                extra: {
                    points: item.points,
                    comments: item.num_comments,
                    author: item.author
                }
            };
        }).filter(function(r) { return r.title !== '（无标题）'; });

        if (results.length === 0) {
            throw new Error('Hacker News 未找到相关结果');
        }

        return results;
    }

    // ==================== 搜索调度 ====================
    var SEARCH_FUNCTIONS = {
        duckduckgo: searchDuckDuckGo,
        wikipedia: searchWikipedia,
        stackoverflow: searchStackOverflow,
        github: searchGitHub,
        news: searchHackerNews
    };

    async function performSearch() {
        var query = searchInput.value.trim();
        if (!query) {
            searchInput.focus();
            return;
        }
        if (isSearching) return;

        isSearching = true;
        searchBtn.disabled = true;

        var engine = currentEngine;
        var engineName = ENGINE_NAMES[engine] || engine;

        resultsMeta.textContent = '搜索中…';
        resultsList.innerHTML =
            '<div class="loading">' +
            '<div class="spinner"></div>' +
            '正在通过 ' + escapeHtml(engineName) + ' 搜索…' +
            '</div>';

        previewContent.innerHTML = '<div class="preview-empty">搜索中…</div>';
        previewMeta.textContent = '—';
        setStatus('正在搜索 · ' + engineName);

        try {
            var results = await SEARCH_FUNCTIONS[engine](query);
            currentResults = results;
            currentSelectedIndex = -1;

            renderResults(results, engineName);
            setStatus('✓ 找到 ' + results.length + ' 个结果 · ' + engineName);

        } catch (err) {
            console.error(err);
            currentResults = [];
            resultsList.innerHTML =
                '<div class="empty-state">' +
                '<span class="big-icon">⚠️</span>' +
                '<div class="big-text">搜索失败</div>' +
                '<div class="sub-text">' + escapeHtml(err.message) + '<br><br>' +
                '可能原因：<br>' +
                '· 网络环境限制（部分引擎需要代理）<br>' +
                '· API 暂时不可用<br>' +
                '· 请稍后重试或切换其他引擎</div>' +
                '</div>';
            resultsMeta.textContent = '失败';
            setStatus('搜索失败 · ' + engineName);
        } finally {
            isSearching = false;
            searchBtn.disabled = false;
        }
    }

    // ==================== 渲染结果列表 ====================
    function renderResults(results, engineName) {
        resultsMeta.textContent = results.length + ' 个结果';

        var html = '';
        results.forEach(function(r, i) {
            html += '<div class="result-item" data-index="' + i + '">';
            html += '<div class="result-title">' + escapeHtml(r.title) + '</div>';
            html += '<div class="result-url">' + escapeHtml(getHostname(r.url) || r.url) + '</div>';
            if (r.snippet) {
                html += '<div class="result-snippet">' + escapeHtml(truncate(r.snippet, 180)) + '</div>';
            }
            html += '<div class="result-meta">';
            html += '<span>📌 ' + escapeHtml(r.source) + '</span>';

            if (r.extra) {
                if (r.extra.stars !== undefined) {
                    html += '<span>⭐ ' + r.extra.stars.toLocaleString() + '</span>';
                }
                if (r.extra.language) {
                    html += '<span>💻 ' + escapeHtml(r.extra.language) + '</span>';
                }
                if (r.extra.score !== undefined) {
                    html += '<span>📊 ' + r.extra.score + '</span>';
                }
                if (r.extra.answers !== undefined) {
                    html += '<span>💬 ' + r.extra.answers + ' 回答</span>';
                }
                if (r.extra.points !== undefined) {
                    html += '<span>👍 ' + r.extra.points + '</span>';
                }
                if (r.extra.comments !== undefined) {
                    html += '<span>💬 ' + r.extra.comments + '</span>';
                }
            }

            html += '</div>';
            html += '</div>';
        });

        resultsList.innerHTML = html;

        // 绑定点击事件
        resultsList.querySelectorAll('.result-item').forEach(function(item) {
            item.addEventListener('click', function() {
                var idx = parseInt(this.getAttribute('data-index'), 10);
                selectResult(idx);
            });
        });

        // 自动选中第一个
        if (results.length > 0) {
            selectResult(0);
        }
    }

    // ==================== 选中结果展示详情 ====================
    function selectResult(index) {
        if (index < 0 || index >= currentResults.length) return;

        currentSelectedIndex = index;

        // 更新列表高亮
        resultsList.querySelectorAll('.result-item').forEach(function(item) {
            var idx = parseInt(item.getAttribute('data-index'), 10);
            item.classList.toggle('active', idx === index);
        });

        // 滚动到可见
        var activeItem = resultsList.querySelector('.result-item[data-index="' + index + '"]');
        if (activeItem) {
            activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }

        // 渲染详情
        var r = currentResults[index];
        previewMeta.textContent = (index + 1) + ' / ' + currentResults.length;

        var html = '<div class="preview-body">';
        html += '<h2>' + escapeHtml(r.title) + '</h2>';
        html += '<div class="preview-url"><a href="' + escapeHtml(r.url) + '" target="_blank" rel="noopener">' + escapeHtml(r.url) + '</a></div>';
        if (r.snippet) {
            html += '<div class="preview-desc">' + escapeHtml(r.snippet) + '</div>';
        }
        html += '<span class="preview-source">📌 ' + escapeHtml(r.source) + '</span>';

        if (r.extra) {
            html += '<div style="margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;">';
            if (r.extra.stars !== undefined) {
                html += '<span class="preview-source">⭐ ' + r.extra.stars.toLocaleString() + ' 星</span>';
            }
            if (r.extra.language) {
                html += '<span class="preview-source">💻 ' + escapeHtml(r.extra.language) + '</span>';
            }
            if (r.extra.forks !== undefined) {
                html += '<span class="preview-source">🍴 ' + r.extra.forks.toLocaleString() + ' 分叉</span>';
            }
            if (r.extra.score !== undefined) {
                html += '<span class="preview-source">📊 得分 ' + r.extra.score + '</span>';
            }
            if (r.extra.answers !== undefined) {
                html += '<span class="preview-source">💬 ' + r.extra.answers + ' 回答</span>';
            }
            if (r.extra.answered) {
                html += '<span class="preview-source" style="color:var(--success);">✓ 已解决</span>';
            }
            if (r.extra.points !== undefined) {
                html += '<span class="preview-source">👍 ' + r.extra.points + '</span>';
            }
            if (r.extra.comments !== undefined) {
                html += '<span class="preview-source">💬 ' + r.extra.comments + '</span>';
            }
            if (r.extra.author) {
                html += '<span class="preview-source">👤 ' + escapeHtml(r.extra.author) + '</span>';
            }
            html += '</div>';
        }

        html += '<a class="preview-open-btn" href="' + escapeHtml(r.url) + '" target="_blank" rel="noopener">↗ 打开原网页</a>';
        html += '</div>';

        previewContent.innerHTML = html;
        previewContent.scrollTop = 0;
    }

    // ==================== 引擎切换 ====================
    engineBar.querySelectorAll('.engine-tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
            var engine = this.getAttribute('data-engine');
            if (engine === currentEngine) return;

            currentEngine = engine;

            engineBar.querySelectorAll('.engine-tab').forEach(function(t) {
                var isActive = t.getAttribute('data-engine') === engine;
                t.classList.toggle('active', isActive);
                t.setAttribute('aria-selected', isActive ? 'true' : 'false');
            });

            setStatus('已切换到 ' + (ENGINE_NAMES[engine] || engine));

            // 如果有输入内容，自动重新搜索
            if (searchInput.value.trim()) {
                performSearch();
            }
        });
    });

    // ==================== 事件绑定 ====================
    searchBtn.addEventListener('click', performSearch);

    searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            performSearch();
        }
    });

    // 方向键上下切换结果
    document.addEventListener('keydown', function(e) {
        // 只在输入框外或输入框有内容且按上下时响应
        if (currentResults.length === 0) return;
        if (document.activeElement === searchInput && !searchInput.value) return;

        if (e.key === 'ArrowDown') {
            e.preventDefault();
            var next = Math.min(currentResults.length - 1, currentSelectedIndex + 1);
            selectResult(next);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            var prev = Math.max(0, currentSelectedIndex - 1);
            selectResult(prev);
        }
    });

    // ==================== 初始化 ====================
    function init() {
        setStatus('选择引擎 · 输入关键词 · 回车搜索');
        searchInput.focus();
    }

    init();

})();
</script>
