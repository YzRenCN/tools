<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nor Tools - 完全免费的网站地图生成器</title>
<style>
:root {
    --primary: #3b4cca;
    --primary-hover: #2a38a8;
    --primary-light: #e8e8ff;
    --primary-border: #c5caf0;
    --border: #e0e0e0;
    --border-light: #f0f0f0;
    --bg: #f5f6f8;
    --text: #1a202c;
    --text-secondary: #4a5568;
    --muted: #718096;
    --paper: #ffffff;
    --hover: #f0f0f5;
    --success: #2f855a;
    --danger: #c53030;
    --radius: 6px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    height: 100%;
    font-family: "Segoe UI", -apple-system, "Microsoft YaHei", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
}

body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* ==================== 顶部栏 ==================== */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 52px;
    padding: 0 24px;
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}

.logo-text {
    font-size: 17px;
    font-weight: 900;
    color: var(--primary);
    letter-spacing: -0.2px;
    white-space: nowrap;
}

.nav-links {
    display: flex;
    gap: 28px;
    align-items: center;
}

.nav-links a {
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--primary);
    white-space: nowrap;
    transition: opacity 0.18s;
}

.nav-links a:hover { opacity: 0.65; }

/* ==================== 主工具栏 ==================== */
.simple-toolbar {
    display: flex;
    align-items: center;
    gap: 0;
    padding: 0 16px;
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    height: 42px;
    overflow-x: auto;
}

.tool-link {
    height: 30px;
    padding: 0 12px;
    background: transparent;
    border: none;
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 12.5px;
    color: var(--text-secondary);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.12s;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
}

.tool-link:hover { color: var(--primary); background: var(--hover); }
.tool-link:active { background: var(--primary-light); }
.tool-link.primary {
    background: var(--primary);
    color: #ffffff;
}
.tool-link.primary:hover {
    background: var(--primary-hover);
}
.tool-link:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

.tool-sep {
    width: 1px;
    height: 20px;
    background: var(--border);
    margin: 0 8px;
    flex-shrink: 0;
}

.tool-status {
    margin-left: auto;
    padding: 0 4px;
    font-size: 11.5px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 7px;
    white-space: nowrap;
    flex-shrink: 0;
}

.dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
    transition: background 0.2s;
}

.dot.busy { background: #d69e2e; }
.dot.error { background: var(--danger); }

/* ==================== 主区 ==================== */
.main {
    flex: 1;
    display: flex;
    overflow: hidden;
    min-height: 0;
}

.pane {
    flex: 0 0 52%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #ffffff;
}

.pane-header {
    height: 30px;
    padding: 0 16px;
    background: #fafbfd;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 10.5px;
    color: var(--muted);
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    flex-shrink: 0;
}

.pane-header .pane-meta {
    font-weight: 500;
    color: #b0b8c4;
    letter-spacing: 0;
    text-transform: none;
    font-size: 10.5px;
}

/* 输入区 */
.input-panel {
    flex-shrink: 0;
    padding: 24px;
    border-bottom: 1px solid var(--border);
    background: #fafbfd;
}

.input-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
}

.url-input {
    flex: 1;
    height: 40px;
    padding: 0 14px;
    font-family: inherit;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #ffffff;
    color: var(--text);
    outline: none;
    transition: all 0.15s;
}

.url-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
}

.url-input::placeholder {
    color: #b0b8c4;
}

.btn-primary {
    height: 40px;
    padding: 0 24px;
    border: none;
    border-radius: var(--radius);
    background: var(--primary);
    color: #ffffff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 2px 6px rgba(59, 76, 202, 0.25);
}

.btn-primary:hover {
    background: var(--primary-hover);
    box-shadow: 0 4px 12px rgba(59, 76, 202, 0.35);
}

.btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none;
}

.option-row {
    display: flex;
    gap: 20px;
    margin-top: 14px;
    flex-wrap: wrap;
    font-size: 12.5px;
    color: var(--text-secondary);
}

.option-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
}

.option-row input[type="checkbox"] {
    width: 14px;
    height: 14px;
    cursor: pointer;
    accent-color: var(--primary);
}

.option-row input[type="number"] {
    width: 70px;
    height: 26px;
    padding: 0 8px;
    font-family: inherit;
    font-size: 12px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: #ffffff;
    color: var(--text);
    outline: none;
}

/* 结果区 */
.result-panel {
    flex: 1;
    overflow: auto;
    padding: 16px 24px;
    background: #ffffff;
    min-height: 0;
}

.result-empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 13px;
    line-height: 2;
}

.result-empty .big-icon {
    font-size: 48px;
    opacity: 0.3;
    margin-bottom: 16px;
    display: block;
}

.result-stats {
    display: flex;
    gap: 24px;
    padding: 12px 16px;
    background: var(--primary-light);
    border-radius: var(--radius);
    margin-bottom: 16px;
    flex-wrap: wrap;
}

.stat-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.stat-value {
    font-size: 20px;
    font-weight: 900;
    color: var(--primary);
    line-height: 1;
}

.stat-label {
    font-size: 10.5px;
    color: var(--text-secondary);
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
}

/* 链接列表 */
.link-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.link-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 4px;
    font-size: 12.5px;
    line-height: 1.5;
    transition: background 0.1s;
}

.link-item:hover {
    background: var(--hover);
}

.link-item .link-idx {
    color: var(--muted);
    font-family: "Consolas", monospace;
    font-size: 11px;
    min-width: 32px;
    text-align: right;
    padding-top: 1px;
}

.link-item .link-url {
    flex: 1;
    word-break: break-all;
    color: var(--text);
    text-decoration: none;
    cursor: pointer;
}

.link-item .link-url:hover {
    color: var(--primary);
    text-decoration: underline;
}

.link-item .link-type {
    font-size: 9px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 3px;
    letter-spacing: 0.3px;
    flex-shrink: 0;
    text-transform: uppercase;
}

.link-type.internal {
    background: #e6f7ef;
    color: #2f855a;
}

.link-type.external {
    background: #fff3e0;
    color: #c05621;
}

/* 右侧预览 */
.preview-pane {
    flex: 0 0 48%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-left: 1px solid var(--border);
    background: #ffffff;
}

.preview-content {
    flex: 1;
    overflow: auto;
    padding: 24px 32px;
    background: #ffffff;
    font-family: "Consolas", "Monaco", "Courier New", monospace;
    font-size: 12.5px;
    line-height: 1.7;
    color: var(--text);
    white-space: pre;
}

.preview-content .xml-tag { color: var(--primary); }
.preview-content .xml-attr { color: #c05621; }
.preview-content .xml-str { color: #2f855a; }
.preview-content .xml-comment { color: #a0aec0; font-style: italic; }

/* 分栏拖拽条 */
.resizer {
    width: 8px;
    background: #f0f2f5;
    cursor: col-resize;
    flex-shrink: 0;
    transition: background 0.15s;
    position: relative;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
}

.resizer:hover { background: var(--primary-light); }

.resizer::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 2px;
    height: 28px;
    background: #c8d0da;
    border-radius: 1px;
    transition: background 0.15s;
}

.resizer:hover::after { background: var(--primary); }

/* ==================== 底部状态栏 ==================== */
.status-bar {
    height: 30px;
    padding: 0 24px;
    background: #ffffff;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--muted);
    flex-shrink: 0;
    gap: 12px;
    font-family: "Consolas", monospace;
}

.status-bar span { white-space: nowrap; }

/* ==================== 响应式 ==================== */
@media (max-width: 768px) {
    .navbar {
        padding: 0 16px;
        height: 46px;
    }
    .logo-text { font-size: 15px; }
    .nav-links { gap: 18px; }
    .nav-links a { font-size: 12.5px; }

    .simple-toolbar {
        padding: 0 10px;
        height: 40px;
    }

    .tool-link {
        height: 28px;
        padding: 0 8px;
        font-size: 11.5px;
    }

    .tool-sep { margin: 0 4px; }

    .main { flex-direction: column; }

    .pane, .preview-pane {
        flex: 1;
        min-height: 0;
    }

    .input-panel { padding: 16px; }
    .url-input, .btn-primary { height: 36px; font-size: 13px; }
    .btn-primary { padding: 0 16px; }

    .result-panel { padding: 12px 16px; }
    .preview-content { padding: 16px 20px; font-size: 11.5px; }

    .resizer {
        width: 100%;
        height: 8px;
        cursor: row-resize;
        border-left: none;
        border-right: none;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
    }
    .resizer::after { width: 28px; height: 2px; }

    .preview-pane {
        border-left: none;
        border-top: 1px solid var(--border);
    }

    .status-bar { padding: 0 16px; font-size: 10px; }
}
</style>
</head>
<body>

<!-- 顶部栏 -->
<header class="navbar">
    <span class="logo-text">Nor Tools</span>
    <nav class="nav-links">
        <a href="https://tools.nor.asia/a">关于</a>
        <a href="https://about.nor.asia/more">更多</a>
        <a href="https://nor.asia">返回</a>
        <a href="https://nor.asia">主页</a>
    </nav>
</header>

<!-- 工具栏 -->
<div class="simple-toolbar">
    <button class="tool-link primary" id="genBtn" title="生成网站地图">
        <strong>生成网站地图</strong>
    </button>

    <span class="tool-sep"></span>

    <button class="tool-link" id="copyBtn" title="复制 XML" disabled>复制 XML</button>
    <button class="tool-link" id="downloadBtn" title="下载 sitemap.xml" disabled>下载 sitemap.xml</button>

    <span class="tool-sep"></span>

    <button class="tool-link" id="clearBtn" title="清空结果">清空</button>

    <div class="tool-status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">就绪</span>
    </div>
</div>

<!-- 主区 -->
<div class="main" id="main">

    <!-- 左：输入 + 结果 -->
    <div class="pane" id="leftPane">
        <div class="pane-header">
            <span>网站链接</span>
            <span class="pane-meta" id="linkCount">0 个链接</span>
        </div>

        <!-- 输入区 -->
        <div class="input-panel">
            <div class="input-row">
                <input
                    type="text"
                    class="url-input"
                    id="urlInput"
                    placeholder="输入网站地址，例如 https://example.com"
                    value=""
                    spellcheck="false"
                >
                <button class="btn-primary" id="fetchBtn">开始抓取</button>
            </div>
            <div class="option-row">
                <label>
                    <input type="checkbox" id="optSameDomain" checked>
                    仅同域名
                </label>
                <label>
                    <input type="checkbox" id="optExternal">
                    包含外部链接
                </label>
                <label>
                    最大链接数
                    <input type="number" id="optMaxLinks" value="200" min="10" max="2000" step="10">
                </label>
            </div>
        </div>

        <!-- 结果区 -->
        <div class="result-panel" id="resultPanel">
            <div class="result-empty" id="resultEmpty">
                <span class="big-icon">🗺️</span>
                <div>输入网站地址并点击「开始抓取」</div>
                <div style="margin-top: 8px; font-size: 11.5px; color: #b0b8c4;">
                    通过公共 API 代理抓取网页，提取链接并生成 sitemap.xml
                </div>
            </div>
            <div id="resultContent" style="display: none;"></div>
        </div>
    </div>

    <!-- 拖拽条 -->
    <div class="resizer" id="resizer"></div>

    <!-- 右：XML 预览 -->
    <div class="preview-pane">
        <div class="pane-header">
            <span>sitemap.xml 预览</span>
            <span class="pane-meta" id="xmlMeta">—</span>
        </div>
        <div class="preview-content" id="previewContent"><?xml version="1.0" encoding="UTF-8"?>
<!-- 生成的网站地图将显示在这里 --></div>
    </div>

</div>

<!-- 底部状态栏 -->
<div class="status-bar">
    <span id="footerInfo">准备就绪 · 输入网址开始</span>
    <span>纯本地 · 不上传</span>
</div>

<script>
(function() {
    'use strict';

    // ==================== DOM ====================
    var $ = function(id) { return document.getElementById(id); };
    var urlInput = $('urlInput');
    var fetchBtn = $('fetchBtn');
    var genBtn = $('genBtn');
    var copyBtn = $('copyBtn');
    var downloadBtn = $('downloadBtn');
    var clearBtn = $('clearBtn');
    var statusText = $('statusText');
    var statusDot = $('statusDot');
    var linkCount = $('linkCount');
    var resultEmpty = $('resultEmpty');
    var resultContent = $('resultContent');
    var previewContent = $('previewContent');
    var xmlMeta = $('xmlMeta');
    var footerInfo = $('footerInfo');
    var resizer = $('resizer');
    var main = $('main');
    var leftPane = $('leftPane');
    var previewPane = document.querySelector('.preview-pane');

    // ==================== 状态 ====================
    var currentLinks = [];
    var currentXml = '';
    var currentBaseUrl = '';
    var isBusy = false;

    // ==================== 工具函数 ====================
    function setStatus(text, type) {
        statusText.textContent = text;
        statusDot.className = 'dot' + (type === 'busy' ? ' busy' : type === 'error' ? ' error' : '');
    }

    function setFooter(text) {
        footerInfo.textContent = text;
    }

    function normalizeUrl(input) {
        var u = (input || '').trim();
        if (!u) return null;
        if (!/^https?:\/\//i.test(u)) {
            u = 'https://' + u;
        }
        try {
            var urlObj = new URL(u);
            return urlObj;
        } catch (e) {
            return null;
        }
    }

    function escapeXml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&apos;');
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // 提取 HTML 中的链接
    function extractLinks(html, baseUrl) {
        var baseObj = new URL(baseUrl);
        var baseHost = baseObj.hostname;
        var links = [];
        var seen = {};
        var maxLinks = parseInt($('optMaxLinks').value, 10) || 200;
        var onlySameDomain = $('optSameDomain').checked;
        var includeExternal = $('optExternal').checked;

        // 正则提取 href
        var hrefRegex = /<a\s+[^>]*href\s*=\s*["']([^"']+)["'][^>]*>/gi;
        var match;
        while ((match = hrefRegex.exec(html)) !== null) {
            var href = match[1].trim();
            if (!href) continue;
            if (/^(javascript|mailto|tel|#|data):/i.test(href)) continue;

            var absUrl;
            try {
                absUrl = new URL(href, baseUrl).href;
            } catch (e) {
                continue;
            }

            // 只保留 http/https
            if (!/^https?:\/\//i.test(absUrl)) continue;

            // 去除锚点
            absUrl = absUrl.split('#')[0];

            // 判断域名
            var linkHost;
            try {
                linkHost = new URL(absUrl).hostname;
            } catch (e) {
                continue;
            }
            var isSameDomain = (linkHost === baseHost);

            if (onlySameDomain && !isSameDomain) continue;
            if (!onlySameDomain && !isSameDomain && !includeExternal) continue;

            if (seen[absUrl]) continue;
            seen[absUrl] = true;

            links.push({
                url: absUrl,
                isExternal: !isSameDomain
            });

            if (links.length >= maxLinks) break;
        }

        return links;
    }

    // ==================== 渲染结果 ====================
    function renderLinks(links) {
        linkCount.textContent = links.length + ' 个链接';

        if (links.length === 0) {
            resultEmpty.style.display = 'block';
            resultEmpty.innerHTML = '<span class="big-icon">🤔</span><div>没有抓取到任何链接</div>';
            resultContent.style.display = 'none';
            return;
        }

        resultEmpty.style.display = 'none';
        resultContent.style.display = 'block';

        var internalCount = 0;
        var externalCount = 0;
        links.forEach(function(l) {
            if (l.isExternal) externalCount++;
            else internalCount++;
        });

        var html = '<div class="result-stats">';
        html += '<div class="stat-item"><span class="stat-value">' + links.length + '</span><span class="stat-label">总链接</span></div>';
        html += '<div class="stat-item"><span class="stat-value">' + internalCount + '</span><span class="stat-label">内部链接</span></div>';
        if (externalCount > 0) {
            html += '<div class="stat-item"><span class="stat-value">' + externalCount + '</span><span class="stat-label">外部链接</span></div>';
        }
        html += '</div>';

        html += '<div class="link-list">';
        links.forEach(function(l, i) {
            var typeClass = l.isExternal ? 'external' : 'internal';
            var typeLabel = l.isExternal ? '外部' : '内部';
            html += '<div class="link-item">';
            html += '<span class="link-idx">' + (i + 1) + '.</span>';
            html += '<a class="link-url" href="' + escapeHtml(l.url) + '" target="_blank" rel="noopener">' + escapeHtml(l.url) + '</a>';
            html += '<span class="link-type ' + typeClass + '">' + typeLabel + '</span>';
            html += '</div>';
        });
        html += '</div>';

        resultContent.innerHTML = html;
    }

    // ==================== 生成 XML ====================
    function buildSitemapXml(links, baseUrl) {
        var now = new Date().toISOString().slice(0, 10);
        var xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
        xml += '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n';
        // 首页
        xml += '  <url>\n';
        xml += '    <loc>' + escapeXml(baseUrl) + '</loc>\n';
        xml += '    <lastmod>' + now + '</lastmod>\n';
        xml += '    <changefreq>daily</changefreq>\n';
        xml += '    <priority>1.0</priority>\n';
        xml += '  </url>\n';
        // 其他链接
        links.forEach(function(l) {
            if (l.isExternal) return;
            xml += '  <url>\n';
            xml += '    <loc>' + escapeXml(l.url) + '</loc>\n';
            xml += '    <lastmod>' + now + '</lastmod>\n';
            xml += '    <changefreq>weekly</changefreq>\n';
            xml += '    <priority>0.8</priority>\n';
            xml += '  </url>\n';
        });
        xml += '</urlset>';
        return xml;
    }

    // 简单 XML 高亮
    function highlightXml(xml) {
        var escaped = escapeHtml(xml);
        // 标签
        escaped = escaped.replace(/(&lt;\/?)([\w:]+)([^&]*?)(&gt;)/g, function(m, p1, p2, p3, p4) {
            return '<span class="xml-tag">' + p1 + p2 + '</span>' + p3 + '<span class="xml-tag">' + p4 + '</span>';
        });
        // 注释
        escaped = escaped.replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span class="xml-comment">$1</span>');
        return escaped;
    }

    function renderXml(xml) {
        currentXml = xml;
        var lines = xml.split('\n').length;
        xmlMeta.textContent = lines + ' 行';
        previewContent.innerHTML = highlightXml(xml);
        copyBtn.disabled = false;
        downloadBtn.disabled = false;
    }

    // ==================== 抓取网站 ====================
    async function fetchWebsite(url) {
        var urlObj = normalizeUrl(url);
        if (!urlObj) {
            alert('请输入有效的网址，例如 https://example.com');
            return;
        }

        if (isBusy) return;
        isBusy = true;

        var targetUrl = urlObj.href;
        currentBaseUrl = targetUrl;
        setStatus('正在抓取…', 'busy');
        setFooter('正在抓取 ' + targetUrl);
        fetchBtn.disabled = true;
        genBtn.disabled = true;

        // 使用 AllOrigins 公共代理绕过 CORS
        var proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(targetUrl);

        try {
            var res = await fetch(proxyUrl, { method: 'GET' });

            if (!res.ok) {
                throw new Error('代理请求失败：' + res.status);
            }

            var data = await res.json();

            if (!data || typeof data.contents !== 'string') {
                throw new Error('返回内容为空');
            }

            var html = data.contents;

            // 如果 contents 看起来是 JSON 错误信息
            if (html.length < 50 && /error|fail/i.test(html)) {
                throw new Error('目标网站返回错误或无法访问');
            }

            // 提取链接
            var links = extractLinks(html, targetUrl);

            currentLinks = links;
            renderLinks(links);

            // 生成 XML
            var xml = buildSitemapXml(links, targetUrl);
            renderXml(xml);

            setStatus('完成 · ' + links.length + ' 个链接', null);
            setFooter('抓取完成 · ' + links.length + ' 个链接 · ' + targetUrl);

        } catch (err) {
            console.error(err);
            setStatus('抓取失败', 'error');
            setFooter('抓取失败：' + err.message);
            resultEmpty.style.display = 'block';
            resultContent.style.display = 'none';
            resultEmpty.innerHTML =
                '<span class="big-icon">⚠️</span>' +
                '<div>抓取失败</div>' +
                '<div style="margin-top: 12px; font-size: 12px; color: #718096; max-width: 500px; line-height: 1.7;">' +
                escapeHtml(err.message) +
                '<br><br>' +
                '可能原因：<br>' +
                '· 目标网站禁止外部抓取<br>' +
                '· 目标网站需要登录才能访问<br>' +
                '· 公共代理服务暂时不可用' +
                '</div>';
            linkCount.textContent = '0 个链接';
            previewContent.textContent = '<!-- 抓取失败 -->';
            xmlMeta.textContent = '—';
            copyBtn.disabled = true;
            downloadBtn.disabled = true;
        } finally {
            isBusy = false;
            fetchBtn.disabled = false;
            genBtn.disabled = false;
        }
    }

    // ==================== 事件绑定 ====================
    function startFetch() {
        var url = urlInput.value.trim();
        if (!url) {
            urlInput.focus();
            return;
        }
        fetchWebsite(url);
    }

    genBtn.addEventListener('click', startFetch);
    fetchBtn.addEventListener('click', startFetch);

    urlInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            startFetch();
        }
    });

    copyBtn.addEventListener('click', function() {
        if (!currentXml) return;
        navigator.clipboard.writeText(currentXml).then(function() {
            setStatus('✓ 已复制到剪贴板', null);
            setFooter('XML 已复制到剪贴板');
            setTimeout(function() {
                setStatus('就绪', null);
            }, 2000);
        }).catch(function() {
            alert('复制失败，请手动选择文本复制');
        });
    });

    downloadBtn.addEventListener('click', function() {
        if (!currentXml) return;
        var blob = new Blob([currentXml], { type: 'application/xml;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'sitemap.xml';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        setStatus('✓ 已下载 sitemap.xml', null);
        setFooter('sitemap.xml 已下载');
    });

    clearBtn.addEventListener('click', function() {
        currentLinks = [];
        currentXml = '';
        currentBaseUrl = '';
        urlInput.value = '';
        resultEmpty.style.display = 'block';
        resultEmpty.innerHTML =
            '<span class="big-icon">🗺️</span>' +
            '<div>输入网站地址并点击「开始抓取」</div>' +
            '<div style="margin-top: 8px; font-size: 11.5px; color: #b0b8c4;">通过公共 API 代理抓取网页，提取链接并生成 sitemap.xml</div>';
        resultContent.style.display = 'none';
        resultContent.innerHTML = '';
        previewContent.textContent = '<?xml version="1.0" encoding="UTF-8"?>\n<!-- 生成的网站地图将显示在这里 -->';
        linkCount.textContent = '0 个链接';
        xmlMeta.textContent = '—';
        copyBtn.disabled = true;
        downloadBtn.disabled = true;
        setStatus('就绪', null);
        setFooter('已清空');
    });

    // ==================== 拖拽分栏 ====================
    var isDragging = false;

    resizer.addEventListener('mousedown', function(e) {
        isDragging = true;
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        e.preventDefault();
    });

    document.addEventListener('mousemove', function(e) {
        if (!isDragging) return;
        var rect = main.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var totalW = rect.width;
        var minW = 200;
        var maxW = totalW - 200;
        x = Math.max(minW, Math.min(maxW, x));
        var percent = (x / totalW) * 100;
        leftPane.style.flex = '0 0 ' + percent + '%';
        previewPane.style.flex = '0 0 ' + (100 - percent - (8 / totalW * 100)) + '%';
    });

    document.addEventListener('mouseup', function() {
        if (isDragging) {
            isDragging = false;
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
        }
    });

    resizer.addEventListener('touchstart', function(e) {
        isDragging = true;
        e.preventDefault();
    }, { passive: false });

    document.addEventListener('touchmove', function(e) {
        if (!isDragging) return;
        var touch = e.touches[0];
        var rect = main.getBoundingClientRect();
        var x = touch.clientX - rect.left;
        var totalW = rect.width;
        var minW = 150;
        var maxW = totalW - 150;
        x = Math.max(minW, Math.min(maxW, x));
        var percent = (x / totalW) * 100;
        leftPane.style.flex = '0 0 ' + percent + '%';
        previewPane.style.flex = '0 0 ' + (100 - percent - (8 / totalW * 100)) + '%';
    }, { passive: false });

    document.addEventListener('touchend', function() {
        isDragging = false;
    });

    // ==================== 初始化 ====================
    setStatus('就绪', null);
    setFooter('准备就绪 · 输入网址开始');
    urlInput.focus();

})();
</script>
</body>
</html>
